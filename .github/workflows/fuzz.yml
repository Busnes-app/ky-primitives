name: Fuzz

# go test only replays a fuzz target's seed corpus. Actually fuzzing needs -fuzz, which
# runs until told to stop, so it belongs on a schedule rather than in the PR path.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./shamir
            target: FuzzCombineNeverPanics
          - package: ./shamir
            target: FuzzParseShareNeverPanics
          - package: ./capsule
            target: FuzzOpenNeverPanics
          - package: ./logging
            target: FuzzFieldValuesCannotForgeALine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
      - name: Fuzz
        env:
          PKG: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test "$PKG" -run '^$' -fuzz "^${TARGET}$" -fuzztime=10m
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: ${{ github.workspace }}/**/testdata/fuzz/**
          if-no-files-found: ignore
