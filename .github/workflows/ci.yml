name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Supersede a pull request's older run; every other run gets its own group so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # go.mod pins 1.26.6; "stable" catches what the next toolchain changes under us.
    # macOS is not redundant: keyfile's fsync/permission handling and the capsule's
    # owner-only mode clamping are the parts that diverge from Linux.
    # The nested offsite module runs in the same leg, after the root module.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', 'stable']
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            offsite/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Strong TLS profile
        env:
          GODEBUG: fips140=on
        run: go test -race -count=1 ./...

      - name: offsite gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: offsite
      - name: offsite build
        run: go build ./...
        working-directory: offsite
      - name: offsite vet
        run: go vet ./...
        working-directory: offsite
      - name: offsite tests
        run: go test -race -count=1 ./...
        working-directory: offsite
      - name: offsite strong TLS profile
        env:
          GODEBUG: fips140=on
        run: go test -race -count=1 ./...
        working-directory: offsite

  vulncheck:
    # nodeps_test.go pins which dependencies are allowed. It says nothing about which
    # versions, and x/crypto is where a password-hashing CVE would land.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: offsite

  reuse:
    # Every file names its license and copyright (REUSE.toml, LICENSES/).
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-no-binaries.sh
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  s3:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUSH_RELAY_URL: ""
      APNS_RELAY_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
      - name: Start disposable signature-checking versioned S3 server
        run: |
          docker run -d --name s3 --memory=512m --memory-swap=512m --cpus=1 --pids-limit=256 \
            -e PUSH_RELAY_URL= -e APNS_RELAY_URL= -p 127.0.0.1:8333:8333 \
            -v "$PWD/.github/ci/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333 && exit 0; sleep 1; done
          docker logs s3; exit 1
      - name: Object/version transport contract
        env:
          KY_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          KY_TEST_S3_BUCKET: ky-primitives-ci
          KY_TEST_S3_ACCESS_KEY: ky-primitives-ci
          KY_TEST_S3_SECRET_KEY: ky-primitives-ci-fixture-secret
        run: go test -race -count=1 -timeout=5m ./s3
