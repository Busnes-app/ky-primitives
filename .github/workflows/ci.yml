name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Supersede a pull request's older run; every other run gets its own group so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # go.mod pins 1.26.6; "stable" catches what the next toolchain changes under us.
    # macOS is not redundant: keyfile's fsync/permission handling and the capsule's
    # owner-only mode clamping are the parts that diverge from Linux.
    # The nested offsite module runs in the same leg, after the root module.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            offsite/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Strong TLS profile
        env:
          GODEBUG: fips140=on
        run: go test -race -count=1 ./...

      - name: offsite gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: offsite
      - name: offsite build
        run: go build ./...
        working-directory: offsite
      - name: offsite vet
        run: go vet ./...
        working-directory: offsite
      - name: offsite tests
        run: go test -race -count=1 ./...
        working-directory: offsite
      - name: offsite strong TLS profile
        env:
          GODEBUG: fips140=on
        run: go test -race -count=1 ./...
        working-directory: offsite

  vulncheck:
    # nodeps_test.go pins which dependencies are allowed. It says nothing about which
    # versions, and x/crypto is where a password-hashing CVE would land.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: offsite

  reuse:
    # Every file names its license and copyright (REUSE.toml, LICENSES/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
